[project]
name = "whstats"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
authors = [
    { name = "tmcaul", email = "tmcauliffe@icloud.com" }
]
requires-python = ">=3.9"
dependencies = [
    "black>=25.11.0",
    "jupyter>=1.1.1",
    "matplotlib>=3.9.4",
    "pandas>=2.3.3",
    "plotly>=7.0.0",
    "pyarrow>=21.0.0",
    "seaborn>=0.13.2",
    "streamlit>=1.50.0",
]

[tool.pyright]
pythonVersion = "3.14"

[project.scripts]
whstats = "whstats:main"

[build-system]
requires = ["uv_build>=0.12.5,<0.13.0"]
build-backend = "uv_build"

[dependency-groups]
dev = [
    "pytest>=8.4.2",
]

[tool.black]
line-length = 100
target-version = ["py311", "py312"]
skip-string-normalization = false
